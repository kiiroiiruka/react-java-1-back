#この中でどのデータベースにアクセスしているのかを管理している
spring.application.name=backend

# DB：PC内で動いているPostgreSQL（ポート5432）の react_java_1 データベースにつなぐ
spring.datasource.url=jdbc:postgresql://localhost:5432/react_java_1
spring.datasource.username=postgres
# パスワードはファイルに直接書かず、環境変数 DB_PASSWORD から読み込む（GitHubに漏れないように）
# 
spring.datasource.password=${DB_PASSWORD}
# Entityクラスの内容に合わせて、テーブルを自動で作成・更新する
spring.jpa.hibernate.ddl-auto=update

# メール：ローカルでは本物のメールは送らず、Mailpit（偽の受信箱、ポート1025）に送る
# 届いたメールは http://localhost:8025 をブラウザで開くと見られる
spring.mail.host=localhost
spring.mail.port=1025

# 確認メールに書くリンクの頭の部分（Reactが動いているURL）
app.frontend-url=http://localhost:5173
