#この中でどのデータベースにアクセスしているのかを管理している
# ${名前:初期値} は「環境変数があればその値、なければ初期値」という意味。
# ローカルでは初期値が使われ、Herokuでは環境変数で本番用の値に差し替わる
spring.application.name=backend

# ポート：Herokuは使うポート番号を環境変数 PORT で指定してくる。ローカルでは8080
server.port=${PORT:8080}

# DB：PC内で動いているPostgreSQL（ポート5432）の react_java_1 データベースにつなぐ
# （Herokuでは start.sh が環境変数 SPRING_DATASOURCE_URL などを作り、こちらより優先される）
spring.datasource.url=jdbc:postgresql://localhost:5432/react_java_1
spring.datasource.username=postgres
# パスワードはファイルに直接書かず、環境変数 DB_PASSWORD から読み込む（GitHubに漏れないように）
#
spring.datasource.password=${DB_PASSWORD}
# Entityクラスの内容に合わせて、テーブルを自動で作成・更新する
spring.jpa.hibernate.ddl-auto=update

# メール：ローカルでは本物のメールは送らず、Mailpit（偽の受信箱、ポート1025）に送る
# 届いたメールは http://localhost:8025 をブラウザで開くと見られる
# Herokuでは環境変数で本物のSMTPサーバー（Gmailなど）に切り替える
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
# 確認メールの差出人
app.mail-from=${MAIL_FROM:no-reply@react-java-1.local}

# 確認メールに書くリンクの頭の部分（Reactが動いているURL）
# 本番では Cloudflare のURL（https://xxxx.workers.dev）を FRONTEND_URL に入れる
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWTのハンコ（署名）に使う秘密の鍵。32文字以上必要
# 下の初期値はローカル開発用。本番では必ず環境変数 JWT_SECRET に、推測できないランダムな値を入れる
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-do-not-use-in-production}

# CORS：APIを呼んでいいフロントのURL（カンマ区切りで複数書ける）
# 本番では Cloudflare のURLを CORS_ALLOWED_ORIGINS に入れる
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
